---
deployment:
  tasks:
    # Keep Laravel and the repository outside the document root. These checks
    # stop deployment before public_html is cleaned if runtime files are missing.
    - /usr/bin/test -f /home/alfajrhe/repositories/cdms/backend/.env
    - /usr/bin/test -f /home/alfajrhe/repositories/cdms/backend/vendor/autoload.php
    - /usr/bin/test -f /home/alfajrhe/repositories/cdms/index.html
    - /bin/mkdir -p /home/alfajrhe/cdms.alfajrhealth.com

    # Publish an explicit allow-list only. --delete-excluded removes source
    # files left behind by the previous deployment layout.
    - /usr/bin/rsync -a --delete --delete-excluded --filter='protect /.well-known/***' --include=/.htaccess --include=/index.php --include=/index.html --include=/favicon.svg --include=/robots.txt --include=/assets/*** --include=/templates/*** --exclude=* /home/alfajrhe/repositories/cdms/ /home/alfajrhe/cdms.alfajrhealth.com/

    - /bin/ln -sfn /home/alfajrhe/repositories/cdms/backend/storage/app/public /home/alfajrhe/cdms.alfajrhealth.com/storage
    - /bin/chmod 755 /home/alfajrhe/cdms.alfajrhealth.com
    - /bin/chmod 600 /home/alfajrhe/repositories/cdms/backend/.env
    - /bin/chmod -R 775 /home/alfajrhe/repositories/cdms/backend/storage /home/alfajrhe/repositories/cdms/backend/bootstrap/cache
